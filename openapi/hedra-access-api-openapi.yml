components:
  schemas:
    TokenCreateRequest:
      properties:
        ttl_seconds:
          anyOf:
          - type: integer
          - type: 'null'
          title: Ttl Seconds
          description: Seconds until the token expires; omitted means the service default.
        scopes:
          anyOf:
          - items:
              $ref: '#/components/schemas/ApiKeyScope'
            type: array
          - type: 'null'
          title: Scopes
          description: Scopes granted to the token. Omitted means every scope of the minting key; an explicit subset narrows the grant, and requesting beyond the key's scopes is a 403.
      type: object
      title: TokenCreateRequest
    BillingError:
      properties:
        balance:
          type: number
          title: Balance
          description: Spendable balance on the account this request bills, at the moment it was refused. The same value `GET /balance` returns.
        required:
          anyOf:
          - type: number
          - type: 'null'
          title: Required
          description: What this request needed. Null when the refusal is a funding precondition rather than a priced one — an upload is not priced, and some models cannot be quoted until their inputs are measured (`POST /models/{model}/estimate` says so explicitly).
        currency:
          type: string
          title: Currency
          description: ISO-4217 code the amounts above are denominated in.
          default: USD
        funding_url:
          type: string
          title: Funding Url
          description: Where a human can add funds to the account this request bills. The API itself cannot add them.
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: 'Why the automatic top-up did not fund the balance, when known. `card_declined`: the card that pays for automatic top-ups was declined, and the payment method must be updated on the billing page before a top-up can succeed. Clients MUST tolerate unrecognized values: new reasons may be added at any time.'
        affordable_output_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Affordable Output Tokens
          description: On a chat request's refusal, the largest output bound in tokens, `max_tokens` or `max_output_tokens` on `POST /responses`, whose hold the balance covers for this request's prompt. A chat request (`POST /chat/completions`, `POST /responses`, `POST /anthropic/v1/messages`) holds its worst-case price, `required`, until it completes. The balance covers the hold of the same request with this bound until the balance changes. 0 when the balance does not cover the prompt with the model's smallest output bound. Null on every other refusal.
      type: object
      required:
      - balance
      - funding_url
      title: BillingError
      description: 'Why a request was refused for funds, and what would clear it.


        The envelope''s structured detail for `INSUFFICIENT_BALANCE`, the way

        `details` is its structured detail for a validation failure. Every amount is

        in `currency`, and `balance` is the same number `GET /balance` returns — so

        a client can decide whether to top up, wait, or fail over without a second

        round trip to work out which balance was short.'
    ErrorEnvelope:
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          title: Message
          description: Human-readable summary of the error. Fixed per condition — match on `code`, not on this text.
        retryable:
          type: boolean
          title: Retryable
          description: Whether retrying the same request can succeed. Describes the condition, not a promise — pair with `retry_after` when present.
          default: false
        retry_after:
          anyOf:
          - type: integer
          - type: 'null'
          title: Retry After
          description: Seconds to wait before retrying; set when the error is retryable. Mirrors the `Retry-After` response header.
        param:
          anyOf:
          - type: string
          - type: 'null'
          title: Param
          description: The primary offending input field, when the error is about one specific field.
        details:
          anyOf:
          - items:
              $ref: '#/components/schemas/FieldError'
            type: array
          - type: 'null'
          title: Details
          description: Every field-level problem, when the error is a validation failure — all of them at once, not just the first.
        replaced_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Replaced By
          description: The id of a successor model, set when the requested model has been retired (code `GONE`) and replaced; null otherwise. Lets a client programmatically migrate off a retired model.
        billing:
          anyOf:
          - $ref: '#/components/schemas/BillingError'
          - type: 'null'
          description: Balance, price, and where to add funds — set when the request was refused for funds (code `INSUFFICIENT_BALANCE`); null otherwise.
        type:
          $ref: '#/components/schemas/ErrorType'
          description: 'The OpenAI error type for this error''s HTTP status: `authentication_error` (401), `permission_error` (403), `rate_limit_error` (429), `server_error` (5xx), and `invalid_request_error` for every other status. Match on `code`, which is more specific.'
          readOnly: true
      type: object
      required:
      - code
      - message
      - type
      title: ErrorEnvelope
    KeyCreateRequest:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Human-readable label for the key.
        scopes:
          anyOf:
          - items:
              $ref: '#/components/schemas/ApiKeyScope'
            type: array
          - type: 'null'
          title: Scopes
          description: Scopes granted to the key; omitted means the creating credential's own scopes.
        kind:
          $ref: '#/components/schemas/ApiKeyKind'
          description: '`personal` (default) dies with the member; `service` is workspace-shared, OWNER/ADMIN-managed, and survives member removal.'
          default: personal
        workspace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Workspace Id
          description: Target workspace; omitted means the authenticating key's workspace.
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
          description: ISO-8601 instant the key stops authenticating; omitted means it never expires.
      type: object
      title: KeyCreateRequest
    FileUploadResponse:
      properties:
        url:
          type: string
          title: Url
          description: 'Presigned GET URL for the stored bytes — the handle itself. Pass it back verbatim, query string included: a modified URL is not recognised as your handle and is rejected as an external URL.'
        content_type:
          type: string
          title: Content Type
          description: MIME type sniffed from the uploaded bytes; the request's own Content-Type and filename are never trusted. Decides which media inputs will accept this handle.
        expires_at:
          type: string
          format: date-time
          title: Expires At
          description: 'ISO-8601 instant after which `url` is rejected. Submitting with a lapsed handle is a 400 with `reason: "expired"`, not a fetch failure; upload the file again for a fresh handle.'
      type: object
      required:
      - url
      - content_type
      - expires_at
      title: FileUploadResponse
      description: '``POST /v3/files`` result. The presigned ``url`` *is* the file handle:

        pass it as ``{"source": "url", "url": <url>}`` in any media input the

        model''s schema advertises (``image`` / ``end_image`` / ``images`` /

        ``audio`` / ``video``) on submit.'
    ErrorType:
      type: string
      enum:
      - invalid_request_error
      - authentication_error
      - permission_error
      - rate_limit_error
      - server_error
      title: ErrorType
      description: 'The OpenAI error type for an error''s HTTP status, published so an

        OpenAI SDK''s `APIStatusError.type` carries a value.'
    FieldError:
      properties:
        field:
          type: string
          title: Field
          description: Dotted path to the offending input (e.g. `input.resolution`).
        message:
          type: string
          title: Message
          description: What is wrong with this field's value.
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Machine-readable hint for which constraint failed ("required", "enum", "type", …).
        allowed:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Allowed
          description: Accepted values for an enum, or accepted field names on the first unknown-field violation. Omitted on subsequent unknown fields.
      type: object
      required:
      - field
      - message
      title: FieldError
      description: 'One field-level validation problem in a request body.


        `field` is the dotted path to the offending input (e.g. `input.resolution`);

        `allowed` lists the accepted values when the field is an enum, so a caller

        can fix it without re-fetching the model schema.'
    KeyCreateResponse:
      properties:
        key_id:
          type: string
          title: Key Id
          description: The key's public identifier.
        credential:
          type: string
          title: Credential
          description: The full `<key_id>:<secret>` pair — a valid Bearer credential. Returned exactly once, at creation; store it now.
        kind:
          $ref: '#/components/schemas/ApiKeyKind'
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Human-readable label for the key.
        scopes:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Scopes
          description: Scopes granted to the key; null means every scope (a legacy key predating scopes).
        workspace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Workspace Id
          description: The workspace the key bills and acts in.
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
          description: ISO-8601 instant the key stops authenticating; null means it never expires.
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At
          description: ISO-8601 instant the key was created.
      type: object
      required:
      - key_id
      - credential
      - kind
      title: KeyCreateResponse
    ErrorCode:
      type: string
      enum:
      - UNKNOWN
      - INVALID_ARGUMENT
      - NOT_FOUND
      - GONE
      - ALREADY_EXISTS
      - ALREADY_IN_PROGRESS
      - UNAUTHORIZED
      - PERMISSION_DENIED
      - INSUFFICIENT_BALANCE
      - MODERATION_FAILED
      - FAILED_PRECONDITION
      - CANCELLED
      - DEADLINE_EXCEEDED
      - RESOURCE_EXHAUSTED
      - UNAVAILABLE
      - INTERNAL
      title: ErrorCode
      description: "Universal error code space. Modeled after gRPC status codes.\n\nEvery exception in the system carries an ErrorCode. SDK clients map\n3rd-party errors to these codes at the lowest level. Retry logic,\nHTTP status mapping, and OTEL metrics all key off this enum.\n\nNOTE: The semantic meaning of these error codes is roughly mapped from the\n    semantic of the gRPC status codes: see\n    https://grpc.io/docs/guides/status-codes/ for details."
    ApiKeyKind:
      type: string
      enum:
      - personal
      - service
      title: ApiKeyKind
      description: Personal keys die with the member; service keys belong to the workspace.
    KeyStatus:
      type: string
      enum:
      - active
      - revoked
      - expired
      title: KeyStatus
    TokenCreateResponse:
      properties:
        token:
          type: string
          title: Token
          description: The ephemeral token — a valid Bearer credential until it expires. Shown exactly once.
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
          description: ISO-8601 instant the token stops authenticating.
      type: object
      required:
      - token
      title: TokenCreateResponse
    KeyRotateResponse:
      properties:
        key_id:
          type: string
          title: Key Id
          description: The key's public identifier — unchanged by rotation.
        credential:
          type: string
          title: Credential
          description: The new `<key_id>:<secret>` pair — a valid Bearer credential, shown exactly once, like at create.
        kind:
          $ref: '#/components/schemas/ApiKeyKind'
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Human-readable label for the key.
        scopes:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Scopes
          description: Scopes granted to the key; null means every scope (a legacy key predating scopes).
        workspace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Workspace Id
          description: The workspace the key bills and acts in.
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
          description: ISO-8601 instant the key stops authenticating; null means it never expires.
        previous_secret_expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Previous Secret Expires At
          description: ISO-8601 instant the previous secret stops authenticating — the end of the grace window.
      type: object
      required:
      - key_id
      - credential
      - kind
      title: KeyRotateResponse
    KeySummary:
      properties:
        key_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Key Id
          description: The key's public identifier; null only for a legacy key that predates public key ids.
        kind:
          $ref: '#/components/schemas/ApiKeyKind'
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Human-readable label for the key.
        scopes:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Scopes
          description: Scopes granted to the key; null means every scope (a legacy key predating scopes).
        workspace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Workspace Id
          description: The workspace the key bills and acts in.
        status:
          $ref: '#/components/schemas/KeyStatus'
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At
          description: ISO-8601 instant the key was created.
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
          description: ISO-8601 instant the key stops authenticating; null means it never expires.
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Revoked At
          description: ISO-8601 instant the key was revoked; null unless `status` is `revoked`.
        last_used_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Used At
          description: ISO-8601 instant the key last authenticated a request; null when unused.
      type: object
      required:
      - key_id
      - kind
      - status
      title: KeySummary
