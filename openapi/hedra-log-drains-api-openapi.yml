components:
  schemas:
    BillingError:
      properties:
        balance:
          type: number
          title: Balance
          description: Spendable balance on the account this request bills, at the moment it was refused. The same value `GET /balance` returns.
        required:
          anyOf:
          - type: number
          - type: 'null'
          title: Required
          description: What this request needed. Null when the refusal is a funding precondition rather than a priced one — an upload is not priced, and some models cannot be quoted until their inputs are measured (`POST /models/{model}/estimate` says so explicitly).
        currency:
          type: string
          title: Currency
          description: ISO-4217 code the amounts above are denominated in.
          default: USD
        funding_url:
          type: string
          title: Funding Url
          description: Where a human can add funds to the account this request bills. The API itself cannot add them.
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: 'Why the automatic top-up did not fund the balance, when known. `card_declined`: the card that pays for automatic top-ups was declined, and the payment method must be updated on the billing page before a top-up can succeed. Clients MUST tolerate unrecognized values: new reasons may be added at any time.'
        affordable_output_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Affordable Output Tokens
          description: On a chat request's refusal, the largest output bound in tokens, `max_tokens` or `max_output_tokens` on `POST /responses`, whose hold the balance covers for this request's prompt. A chat request (`POST /chat/completions`, `POST /responses`, `POST /anthropic/v1/messages`) holds its worst-case price, `required`, until it completes. The balance covers the hold of the same request with this bound until the balance changes. 0 when the balance does not cover the prompt with the model's smallest output bound. Null on every other refusal.
      type: object
      required:
      - balance
      - funding_url
      title: BillingError
      description: 'Why a request was refused for funds, and what would clear it.


        The envelope''s structured detail for `INSUFFICIENT_BALANCE`, the way

        `details` is its structured detail for a validation failure. Every amount is

        in `currency`, and `balance` is the same number `GET /balance` returns — so

        a client can decide whether to top up, wait, or fail over without a second

        round trip to work out which balance was short.'
    ErrorEnvelope:
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          title: Message
          description: Human-readable summary of the error. Fixed per condition — match on `code`, not on this text.
        retryable:
          type: boolean
          title: Retryable
          description: Whether retrying the same request can succeed. Describes the condition, not a promise — pair with `retry_after` when present.
          default: false
        retry_after:
          anyOf:
          - type: integer
          - type: 'null'
          title: Retry After
          description: Seconds to wait before retrying; set when the error is retryable. Mirrors the `Retry-After` response header.
        param:
          anyOf:
          - type: string
          - type: 'null'
          title: Param
          description: The primary offending input field, when the error is about one specific field.
        details:
          anyOf:
          - items:
              $ref: '#/components/schemas/FieldError'
            type: array
          - type: 'null'
          title: Details
          description: Every field-level problem, when the error is a validation failure — all of them at once, not just the first.
        replaced_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Replaced By
          description: The id of a successor model, set when the requested model has been retired (code `GONE`) and replaced; null otherwise. Lets a client programmatically migrate off a retired model.
        billing:
          anyOf:
          - $ref: '#/components/schemas/BillingError'
          - type: 'null'
          description: Balance, price, and where to add funds — set when the request was refused for funds (code `INSUFFICIENT_BALANCE`); null otherwise.
        type:
          $ref: '#/components/schemas/ErrorType'
          description: 'The OpenAI error type for this error''s HTTP status: `authentication_error` (401), `permission_error` (403), `rate_limit_error` (429), `server_error` (5xx), and `invalid_request_error` for every other status. Match on `code`, which is more specific.'
          readOnly: true
      type: object
      required:
      - code
      - message
      - type
      title: ErrorEnvelope
    LogDrainFormat:
      type: string
      enum:
      - ndjson
      - otlp
      title: LogDrainFormat
      description: Wire encoding for one log drain endpoint's HTTP posts.
    LogDrainTestResponse:
      properties:
        ok:
          type: boolean
          title: Ok
          description: Whether the test batch got a 2xx from the endpoint.
        response_status:
          anyOf:
          - type: integer
          - type: 'null'
          title: Response Status
          description: HTTP status the endpoint returned; null when the request never got a response.
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
          description: Why the test failed; null on success.
      type: object
      required:
      - ok
      title: LogDrainTestResponse
    ErrorType:
      type: string
      enum:
      - invalid_request_error
      - authentication_error
      - permission_error
      - rate_limit_error
      - server_error
      title: ErrorType
      description: 'The OpenAI error type for an error''s HTTP status, published so an

        OpenAI SDK''s `APIStatusError.type` carries a value.'
    FieldError:
      properties:
        field:
          type: string
          title: Field
          description: Dotted path to the offending input (e.g. `input.resolution`).
        message:
          type: string
          title: Message
          description: What is wrong with this field's value.
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Machine-readable hint for which constraint failed ("required", "enum", "type", …).
        allowed:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Allowed
          description: Accepted values for an enum, or accepted field names on the first unknown-field violation. Omitted on subsequent unknown fields.
      type: object
      required:
      - field
      - message
      title: FieldError
      description: 'One field-level validation problem in a request body.


        `field` is the dotted path to the offending input (e.g. `input.resolution`);

        `allowed` lists the accepted values when the field is an enum, so a caller

        can fix it without re-fetching the model schema.'
    LogDrainCreate:
      allOf:
      - if:
          properties:
            format:
              enum:
              - ndjson
        then:
          properties:
            secret:
              type: string
          required:
          - secret
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
          description: Human-readable label.
        url:
          type: string
          maxLength: 8192
          minLength: 1
          title: Url
          description: HTTPS endpoint job-log batches are posted to.
        format:
          $ref: '#/components/schemas/LogDrainFormat'
          default: ndjson
        secret:
          anyOf:
          - type: string
            maxLength: 4096
            minLength: 64
            format: password
            writeOnly: true
          - type: 'null'
          title: Secret
          description: Signs every NDJSON post. Required when `format` is `ndjson` (the default); optional for `otlp` drains, whose receivers authenticate with `headers` instead.
          writeOnly: true
        headers:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Headers
          description: Extra headers sent with every post — typically the receiver's authentication. Stored values are never echoed back; reads expose `header_names` only.
          writeOnly: true
        enabled:
          type: boolean
          title: Enabled
          description: Whether the drain receives batches.
          default: true
        batch_size:
          type: integer
          maximum: 5000.0
          minimum: 1.0
          title: Batch Size
          description: Maximum log lines per post.
          default: 1000
      type: object
      required:
      - name
      - url
      title: LogDrainCreate
    ErrorCode:
      type: string
      enum:
      - UNKNOWN
      - INVALID_ARGUMENT
      - NOT_FOUND
      - GONE
      - ALREADY_EXISTS
      - ALREADY_IN_PROGRESS
      - UNAUTHORIZED
      - PERMISSION_DENIED
      - INSUFFICIENT_BALANCE
      - MODERATION_FAILED
      - FAILED_PRECONDITION
      - CANCELLED
      - DEADLINE_EXCEEDED
      - RESOURCE_EXHAUSTED
      - UNAVAILABLE
      - INTERNAL
      title: ErrorCode
      description: "Universal error code space. Modeled after gRPC status codes.\n\nEvery exception in the system carries an ErrorCode. SDK clients map\n3rd-party errors to these codes at the lowest level. Retry logic,\nHTTP status mapping, and OTEL metrics all key off this enum.\n\nNOTE: The semantic meaning of these error codes is roughly mapped from the\n    semantic of the gRPC status codes: see\n    https://grpc.io/docs/guides/status-codes/ for details."
    LogDrainConfig:
      properties:
        id:
          type: string
          title: Id
          description: The drain's id (`drain_<uuid>`).
        name:
          type: string
          title: Name
          description: Human-readable label.
        url:
          type: string
          title: Url
          description: The destination endpoint.
        format:
          $ref: '#/components/schemas/LogDrainFormat'
        header_names:
          items:
            type: string
          type: array
          title: Header Names
          description: Names of the configured extra headers. Values are write-only and never echoed back.
        enabled:
          type: boolean
          title: Enabled
          description: Whether the drain receives batches.
        batch_size:
          type: integer
          title: Batch Size
          description: Maximum log lines per post.
        consecutive_failures:
          type: integer
          title: Consecutive Failures
          description: Failed batches since the last success; the drain auto-disables when it crosses the failure threshold.
        last_success_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Success At
          description: ISO-8601 instant of the last delivered batch.
        last_failure_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Failure At
          description: ISO-8601 instant of the last failed batch.
        last_failure_status:
          anyOf:
          - type: integer
          - type: 'null'
          title: Last Failure Status
          description: HTTP status of the last failed batch; null when it never got a response.
        last_error:
          anyOf:
          - $ref: '#/components/schemas/ErrorEnvelope'
          - type: 'null'
          description: 'Why the most recent batch delivery failed, in the same error envelope `GET /jobs/{job_id}` returns for a failed job: a stable `code` from the shared error vocabulary, a fixed operator-facing `message`, and `retryable`. Null while no batch has failed, and cleared on the next success. Destination URLs, headers, credentials, response bodies, and internal exception text are never included. `retryable` describes the condition, not what Hedra did: every failed batch is requeued until the drain auto-disables, so it answers whether fixing the destination and re-enabling is likely to help. Drains that last failed before this field became structured report `UNKNOWN`.'
        disabled_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Disabled Reason
          description: Why the drain is off (`consecutive_failures` for auto-disable, `disabled_by_user`); null while enabled.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: ISO-8601 instant the drain was created.
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: ISO-8601 instant the config last changed.
        updated_by_key_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated By Key Id
          description: The API key that last changed the config.
      type: object
      required:
      - id
      - name
      - url
      - format
      - enabled
      - batch_size
      - consecutive_failures
      - created_at
      - updated_at
      title: LogDrainConfig
    LogDrainUpdate:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Name
          description: New label; omitted means unchanged.
        url:
          anyOf:
          - type: string
            maxLength: 8192
            minLength: 1
          - type: 'null'
          title: Url
          description: New destination; omitted means unchanged.
        format:
          anyOf:
          - $ref: '#/components/schemas/LogDrainFormat'
          - type: 'null'
          description: New wire format; omitted means unchanged.
        secret:
          anyOf:
          - type: string
            maxLength: 4096
            minLength: 64
            format: password
            writeOnly: true
          - type: 'null'
          title: Secret
          description: 'Rotates the signing secret. No conditional applies here: the drain may already hold one. Switching `format` to `ndjson` on a drain with no stored secret requires supplying one in the same request.'
          writeOnly: true
        headers:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Headers
          description: Replaces the full header set; `{}` clears it. Omitted means unchanged.
          writeOnly: true
        enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enabled
          description: Pause (false) or resume (true) the drain; omitted means unchanged. Re-enabling clears the auto-disable failure count.
        batch_size:
          anyOf:
          - type: integer
            maximum: 5000.0
            minimum: 1.0
          - type: 'null'
          title: Batch Size
          description: New maximum log lines per post; omitted means unchanged.
      type: object
      title: LogDrainUpdate
    LogDrainListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/LogDrainConfig'
          type: array
          title: Data
          description: This page of items.
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
          description: Opaque cursor for the next page, or null when this response completes the list. Always present. Endpoints that serve the whole collection at once always return null.
      type: object
      required:
      - data
      - next_cursor
      title: LogDrainListResponse
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorEnvelope'
        trace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Trace Id
          description: Debug id to quote to support (32-char hex trace id), also emitted as the `X-Trace-Id` response header.
      type: object
      required:
      - error
      title: ErrorResponse
      description: 'Top-level error body: ``{"error": {...}}`` plus a debug id.'
  securitySchemes:
    KeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Primary scheme: `Authorization: Key <key_id>:<secret>`.'
    BearerToken:
