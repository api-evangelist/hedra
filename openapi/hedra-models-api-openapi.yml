components:
  schemas:
    JobListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/JobSummary'
          type: array
          title: Data
          description: This page of items.
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
          description: Opaque cursor for the next page, or null when this response completes the list. Always present. Endpoints that serve the whole collection at once always return null.
      type: object
      required:
      - data
      - next_cursor
      title: JobListResponse
    ErrorEnvelope:
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          title: Message
          description: Human-readable summary of the error. Fixed per condition — match on `code`, not on this text.
        retryable:
          type: boolean
          title: Retryable
          description: Whether retrying the same request can succeed. Describes the condition, not a promise — pair with `retry_after` when present.
          default: false
        retry_after:
          anyOf:
          - type: integer
          - type: 'null'
          title: Retry After
          description: Seconds to wait before retrying; set when the error is retryable. Mirrors the `Retry-After` response header.
        param:
          anyOf:
          - type: string
          - type: 'null'
          title: Param
          description: The primary offending input field, when the error is about one specific field.
        details:
          anyOf:
          - items:
              $ref: '#/components/schemas/FieldError'
            type: array
          - type: 'null'
          title: Details
          description: Every field-level problem, when the error is a validation failure — all of them at once, not just the first.
        replaced_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Replaced By
          description: The id of a successor model, set when the requested model has been retired (code `GONE`) and replaced; null otherwise. Lets a client programmatically migrate off a retired model.
        billing:
          anyOf:
          - $ref: '#/components/schemas/BillingError'
          - type: 'null'
          description: Balance, price, and where to add funds — set when the request was refused for funds (code `INSUFFICIENT_BALANCE`); null otherwise.
        type:
          $ref: '#/components/schemas/ErrorType'
          description: 'The OpenAI error type for this error''s HTTP status: `authentication_error` (401), `permission_error` (403), `rate_limit_error` (429), `server_error` (5xx), and `invalid_request_error` for every other status. Match on `code`, which is more specific.'
          readOnly: true
      type: object
      required:
      - code
      - message
      - type
      title: ErrorEnvelope
    EstimateResponse:
      properties:
        model:
          type: string
          title: Model
          description: The resolved model id this estimate prices.
        cost:
          type: number
          title: Cost
          description: The price of submitting the request's `input` to the model, in `currency`, after any discount negotiated for the key's workspace.
        list_cost:
          anyOf:
          - type: number
          - type: 'null'
          title: List Cost
          description: The model's list price for the same request, in `currency`, before any negotiated discount; equal to `cost` when none applies.
        discount_percent:
          anyOf:
          - type: number
          - type: 'null'
          title: Discount Percent
          description: The negotiated percentage off the model's list price that `cost` reflects, e.g. 20 or 12.5; null when none applies.
        currency:
          type: string
          title: Currency
          description: ISO-4217 currency code for `cost`.
      type: object
      required:
      - model
      - cost
      - currency
      title: EstimateResponse
      description: The price, in US dollars, of submitting the request's `input` to the model.
    VoiceSummary:
      properties:
        id:
          type: string
          title: Id
          description: The voice's id (`voice_<uuid>`); pass it as `input.voice_id` on submit.
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Human-readable name.
        preview_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Preview Url
          description: URL of a short audio sample of this voice.
        labels:
          additionalProperties:
            type: string
          type: object
          title: Labels
          description: Curation metadata (language, gender, accent, ...).
      type: object
      required:
      - id
      title: VoiceSummary
      description: One voice a model accepts; `id` goes into ``input.voice_id`` on submit.
    VoiceGender:
      type: string
      enum:
      - male
      - female
      title: VoiceGender
      description: 'The `gender` curation label, as a voice search filter.


        Two members because the label carries exactly two values across every

        provider; published as an enum so a generated SDK types the filter rather

        than taking any string and failing at the boundary.'
    VoiceListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/VoiceSummary'
          type: array
          title: Data
          description: This page of items.
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
          description: Opaque cursor for the next page, or null when this response completes the list. Always present. Endpoints that serve the whole collection at once always return null.
      type: object
      required:
      - data
      - next_cursor
      title: VoiceListResponse
    Modality:
      type: string
      enum:
      - image
      - video
      - audio
      - text
      title: Modality
      description: The kind of output a model produces — the axis `?modality=` filters on.
    ErrorCode:
      type: string
      enum:
      - UNKNOWN
      - INVALID_ARGUMENT
      - NOT_FOUND
      - GONE
      - ALREADY_EXISTS
      - ALREADY_IN_PROGRESS
      - UNAUTHORIZED
      - PERMISSION_DENIED
      - INSUFFICIENT_BALANCE
      - MODERATION_FAILED
      - FAILED_PRECONDITION
      - CANCELLED
      - DEADLINE_EXCEEDED
      - RESOURCE_EXHAUSTED
      - UNAVAILABLE
      - INTERNAL
      title: ErrorCode
      description: "Universal error code space. Modeled after gRPC status codes.\n\nEvery exception in the system carries an ErrorCode. SDK clients map\n3rd-party errors to these codes at the lowest level. Retry logic,\nHTTP status mapping, and OTEL metrics all key off this enum.\n\nNOTE: The semantic meaning of these error codes is roughly mapped from the\n    semantic of the gRPC status codes: see\n    https://grpc.io/docs/guides/status-codes/ for details."
    ModelSummary:
      properties:
        id:
          type: string
          title: Id
          description: The model's public id — the value POST /v3/models/{model} takes.
        modality:
          $ref: '#/components/schemas/Modality'
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Human-readable name.
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: One-line summary of what the model does.
        price_description:
          type: string
          title: Price Description
          description: Short USD pricing summary for this model. Exact cost depends on input.
          default: Price varies by generation settings.
        logo_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Logo Url
          description: URL of the provider's logo.
        context_length:
          anyOf:
          - type: integer
          - type: 'null'
          title: Context Length
          description: A chat model's context window in tokens; null for other models.
        max_output_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Output Tokens
          description: The largest `max_tokens` a chat model accepts; null for other models.
      type: object
      required:
      - id
      - modality
      title: ModelSummary
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorEnvelope'
        trace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Trace Id
          description: Debug id to quote to support (32-char hex trace id), also emitted as the `X-Trace-Id` response header.
      type: object
      required:
      - error
      title: ErrorResponse
      description: 'Top-level error body: ``{"error": {...}}`` plus a debug id.'
    BillingError:
      properties:
        balance:
          type: number
          title: Balance
          description: Spendable balance on the account this request bills, at the moment it was refused. The same value `GET /balance` returns.
        required:
          anyOf:
          - type: number
          - type: 'null'
          title: Required
          description: What this request needed. Null when the refusal is a funding precondition rather than a priced one — an upload is not priced, and some models cannot be quoted until their inputs are measured (`POST /models/{model}/estimate` says so explicitly).
        currency:
          type: string
          title: Currency
          description: ISO-4217 code the amounts above are denominated in.
          default: USD
        funding_url:
          type: string
          title: Funding Url
          description: Where a human can add funds to the account this request bills. The API itself cannot add them.
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: 'Why the automatic top-up did not fund the balance, when known. `card_declined`: the card that pays for automatic top-ups was declined, and the payment method must be updated on the billing page before a top-up can succeed. Clients MUST tolerate unrecognized values: new reasons may be added at any time.'
        affordable_output_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Affordable Output Tokens
          description: On a chat request's refusal, the largest output bound in tokens, `max_tokens` or `max_output_tokens` on `POST /responses`, whose hold the balance covers for this request's prompt. A chat request (`POST /chat/completions`, `POST /responses`, `POST /anthropic/v1/messages`) holds its worst-case price, `required`, until it completes. The balance covers the hold of the same request with this bound until the balance changes. 0 when the balance does not cover the prompt with the model's smallest output bound. Null on every other refusal.
      type: object
      required:
      - balance
      - funding_url
      title: BillingError
      description: 'Why a request was refused for funds, and what would clear it.


        The envelope''s structured detail for `INSUFFICIENT_BALANCE`, the way

        `details` is its structured detail for a validation failure. Every amount is

        in `currency`, and `balance` is the same number `GET /balance` returns — so

        a client can decide whether to top up, wait, or fail over without a second

        round trip to work out which balance was short.'
    JobSummary:
      properties:
        job_id:
          type: string
          title: Job Id
          description: The job's id — server-issued, and opaque.
        model:
          type: string
          title: Model
          description: The resolved model id this job ran on.
        quality:
          anyOf:
          - type: string
          - type: 'null'
          title: Quality
          description: The quality level this job ran at; present only for models that offer quality levels.
        status:
          $ref: '#/components/schemas/JobStatus'
        created_at:
          type: string
          format: date-time
          title: Created At
          description: ISO-8601 instant the job was submitted.
      type: object
      required:
      - job_id
      - model
      - status
      - created_at
      title: JobSummary
    ErrorType:
      type: string
      enum:
      - invalid_request_error
      - authentication_error
      - permission_error
      - rate_limit_error
      - server_error
      title: ErrorType
      description: 'The OpenAI error type for an error''s HTTP status, published so an

        OpenAI SDK''s `APIStatusError.type` carries a value.'
    FieldError:
      properties:
        field:
          type: string
          title: Field
          description: Dotted path to the offending input (e.g. `input.resolution`).
        message:
          type: string
          title: Message
          description: What is wrong with this field's value.
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Machine-readable hint for which constraint failed ("required", "enum", "type", …).
        allowed:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Allowed
          description: Accepted values for an enum, or accepted field names on the first unknown-field violation. Omitted on subsequent unknown fields.
      type: object
      required:
      - field
      - message
      title: FieldError
      description: 'One field-level validation problem in a request body.


        `field` is the dotted path to the offending input (e.g. `input.resolution`);

        `allowed` lists the accepted values when the field is an enum, so a caller

        can fix it without re-fetching the model schema.'
    ModelListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/ModelSummary'
          type: array
          title: Data
          description: This page of items.
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
          description: Opaque cursor for the next page, or null when this response completes the list. Always present. Endpoints that serve the whole collection at once always return null.
      type: object
      required:
      - data
      - next_cursor
      title: ModelListResponse
    ChatTokenPricing:
      properties:
        usd_per_1m_input_tokens:
          type: number
          title: Usd Per 1M Input Tokens
          description: USD per million prompt tokens not served from cache. `price_description` states the cached rate where it differs.
        usd_per_1m_output_tokens:
          type: number
          title: Usd Per 1M Output Tokens
          description: USD per million completion tokens, reasoning tokens included.
      type: object
      required:
      - usd_per_1m_input_tokens
      - usd_per_1m_output_tokens
      title: ChatTokenPricing
    ModelDetail:
      properties:
        id:
          type: string
          title: Id
          description: The model's public id — the value POST /v3/models/{model} takes.
        modality:
          $ref: '#/components/schemas/Modality'
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Human-readable name.
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: One-line summary of what the model does.
        price_description:
          type: string
          title: Price Description
          description: Short USD pricing summary for this model. Exact cost depends on input.
          default: Price varies by generation settings.
        logo_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Logo Url
          description: URL of the provider's logo.
        context_length:
          anyOf:
          - type: integer
          - type: 'null'
          title: Context Length
          description: A chat model's context window in tokens; null for other models.
        max_output_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Output Tokens
          description: The largest `max_tokens` a chat model accepts; null for other models.
        input_schema:
          additionalProperties: true
          type: object
          title: Input Schema
          description: JSON Schema for this model's `input` object on submit — the same schema `GET /v3/models/{model}/openapi.json` embeds. For a chat model, the JSON Schema of the `POST /v3/chat/completions` request body as this model accepts it; a chat model has no per-model OpenAPI document.
        output_schema:
          additionalProperties: true
          type: object
          title: Output Schema
          description: JSON Schema of one item of a completed job's `outputs[]`. Empty for a chat model.
        chat:
          anyOf:
          - $ref: '#/components/schemas/ChatCapabilities'
          - type: 'null'
          description: 'The facts about a chat model that its `input_schema` cannot state: token prices, the default output bound and the image limit; null for other models.'
      type: object
      required:
      - id
      - modality
      title: ModelDetail
    ChatCapabilities:
      properties:
        default_max_tokens:
          type: integer
          title: Default Max Tokens
          description: The output bound of a request that sets neither `max_tokens` nor `max_completion_tokens`.
        pricing:
          $ref: '#/components/schemas/ChatTokenPricing'
        input_modalities:
          items:
            type: string
          type: array
          title: Input Modalities
          description: '`text`, and `image` when the model accepts image parts.'
        max_images_per_request:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Images Per Request
          description: The most image parts one request may contain; null when the model accepts no images.
      type: object
      required:
      - default_max_tokens
      - pricing
      - input_modalities
      - max_images_per_request
      title: ChatCapabilities
    EstimateRequest:
      properties:
        input:
          additionalProperties: true
          type: object
          title: Input
          description: The same model-specific inputs a submit would carry; the estimate prices exactly this body.
      type: object
      title: EstimateRequest
    JobStatus:
      type: string
      enum:
      - IN_QUEUE
      - IN_PROGRESS
      - COMPLETED
      - FAILED
      title: JobStatus
      description: The four states a job can be in.
  securitySchemes:
    KeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Primary scheme: `Authorization: Key <key_id>:<secret>`.'
    BearerToken:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer <credential>` — accepts an API key (`<key_id>:<secret>`) or an ephemeral browser token minted via `POST /tokens` (inherits the minting key''s scopes and workspace).'
