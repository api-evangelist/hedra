  /models/{model}/voices/search:
    get:
      tags:
      - Models
      summary: Search Model Voices
      description: The voices this model accepts, ranked against a description — the whole shared library, including the voices the listing does not return.
      operationId: models_search_voices
      parameters:
      - name: model
        in: path
        required: true
        schema:
          type: string
          description: The model's public id (`GET /v3/models`).
          title: Model
        description: The model's public id (`GET /v3/models`).
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
          description: What the voice should sound like, in plain words — "warm british narrator", "energetic young announcer". Matched against the whole library for this model's provider, not just the voices `GET /v3/models/{model}/voices` returns.
          title: Q
        description: What the voice should sound like, in plain words — "warm british narrator", "energetic young announcer". Matched against the whole library for this model's provider, not just the voices `GET /v3/models/{model}/voices` returns.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          description: Maximum voices to return. Applies to the whole response.
          default: 20
          title: Limit
        description: Maximum voices to return. Applies to the whole response.
      - name: gender
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/VoiceGender'
          - type: 'null'
          description: Only voices curated with this gender.
          title: Gender
        description: Only voices curated with this gender.
      - name: language
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 8
          - type: 'null'
          description: Only voices curated for this language, as an ISO 639-1 two-letter code (`en`, `es`, `fr`).
          title: Language
