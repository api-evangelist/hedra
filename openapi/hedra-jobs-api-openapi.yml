components:
  schemas:
    OutputStatus:
      type: string
      enum:
      - COMPLETED
      - FAILED
      - EXPIRED
      title: OutputStatus
      description: The state of a single output within a job's result.
    JobListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/JobSummary'
          type: array
          title: Data
          description: This page of items.
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
          description: Opaque cursor for the next page, or null when this response completes the list. Always present. Endpoints that serve the whole collection at once always return null.
      type: object
      required:
      - data
      - next_cursor
      title: JobListResponse
    ErrorEnvelope:
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          title: Message
          description: Human-readable summary of the error. Fixed per condition — match on `code`, not on this text.
        retryable:
          type: boolean
          title: Retryable
          description: Whether retrying the same request can succeed. Describes the condition, not a promise — pair with `retry_after` when present.
          default: false
        retry_after:
          anyOf:
          - type: integer
          - type: 'null'
          title: Retry After
          description: Seconds to wait before retrying; set when the error is retryable. Mirrors the `Retry-After` response header.
        param:
          anyOf:
          - type: string
          - type: 'null'
          title: Param
          description: The primary offending input field, when the error is about one specific field.
        details:
          anyOf:
          - items:
              $ref: '#/components/schemas/FieldError'
            type: array
          - type: 'null'
          title: Details
          description: Every field-level problem, when the error is a validation failure — all of them at once, not just the first.
        replaced_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Replaced By
          description: The id of a successor model, set when the requested model has been retired (code `GONE`) and replaced; null otherwise. Lets a client programmatically migrate off a retired model.
        billing:
          anyOf:
          - $ref: '#/components/schemas/BillingError'
          - type: 'null'
          description: Balance, price, and where to add funds — set when the request was refused for funds (code `INSUFFICIENT_BALANCE`); null otherwise.
        type:
          $ref: '#/components/schemas/ErrorType'
          description: 'The OpenAI error type for this error''s HTTP status: `authentication_error` (401), `permission_error` (403), `rate_limit_error` (429), `server_error` (5xx), and `invalid_request_error` for every other status. Match on `code`, which is more specific.'
          readOnly: true
      type: object
      required:
      - code
      - message
      - type
      title: ErrorEnvelope
    JobLogListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/JobLogItem'
          type: array
          title: Data
          description: This page of items.
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
          description: Opaque cursor for the next page, or null when this response completes the list. Always present. Endpoints that serve the whole collection at once always return null.
      type: object
      required:
      - data
      - next_cursor
      title: JobLogListResponse
    ResultResponse:
      properties:
        job_id:
          type: string
          title: Job Id
          description: The job this envelope describes.
        model:
          type: string
          title: Model
          description: The resolved model id this job ran on.
        quality:
          anyOf:
          - type: string
          - type: 'null'
          title: Quality
          description: The quality level this job ran at; present only for models that offer quality levels.
        status:
          $ref: '#/components/schemas/JobStatus'
        prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: Prompt
          description: The prompt this job ran with. When `enhance_prompt` was set, this is the rewritten prompt the model received rather than the one submitted. Absent on models that take no prompt.
        outputs:
          items:
            $ref: '#/components/schemas/OutputItem'
          type: array
          title: Outputs
          description: The job's outputs — always an array, even for a single output; empty until the job completes. Always empty for a chat completion, whose text the chat response returned.
        metrics:
          anyOf:
          - $ref: '#/components/schemas/Metrics'
          - type: 'null'
          description: Timing for this job; present on completed jobs, and on every finished chat completion.
        usage:
          anyOf:
          - $ref: '#/components/schemas/ChatUsage'
          - type: 'null'
          description: The tokens a chat completion used; absent for other jobs and before a chat completion's usage is recorded.
        error:
          anyOf:
          - $ref: '#/components/schemas/ErrorEnvelope'
          - type: 'null'
          description: Why the job failed; null unless `status` is `FAILED`.
        logs:
          anyOf:
          - items:
              $ref: '#/components/schemas/JobLogItem'
            type: array
          - type: 'null'
          title: Logs
          description: The most recent lifecycle events for this job, oldest first. Capped; GET /v3/jobs/{job_id}/logs serves the full paginated history. Both are empty after `DELETE /v3/jobs/{job_id}`, and can be empty once the job's output is `EXPIRED`. Absent from webhook payloads.
        cost:
          anyOf:
          - type: number
          - type: 'null'
          title: Cost
          description: Net cost of this job; 0 when fully refunded; absent until charged. Absent from webhook payloads. A chat completion that the caller disconnected or stopped reading (`CANCELLED`), or that reached its deadline (`DEADLINE_EXCEEDED`), is `FAILED` and costs the tokens the model reported; one that the model failed (`UNAVAILABLE`) costs 0.
        currency:
          anyOf:
          - type: string
          - type: 'null'
          title: Currency
          description: ISO-4217 currency code for `cost`. Present exactly when `cost` is.
      type: object
      required:
      - job_id
      - model
      - status
      title: ResultResponse
    ChatUsage:
      properties:
        prompt_tokens:
          type: integer
          title: Prompt Tokens
          description: Tokens in the prompt.
        cached_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Cached Tokens
          description: Of `prompt_tokens`, how many the model served from cache, which Hedra charges at the model's cached input rate; null when the model did not report the count.
        completion_tokens:
          type: integer
          title: Completion Tokens
          description: Tokens generated, reasoning tokens included.
        reasoning_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Reasoning Tokens
          description: Of `completion_tokens`, how many the model spent reasoning; null when the model reports none.
        estimated:
          type: boolean
          title: Estimated
          description: True when the model reported no usage and the counts are estimated from the request and response bytes.
      type: object
      required:
      - prompt_tokens
      - completion_tokens
      - estimated
      title: ChatUsage
      description: The tokens a chat completion used, as the model reported them.
    OutputItem:
      properties:
        status:
          $ref: '#/components/schemas/OutputStatus'
          default: COMPLETED
        asset_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Asset Id
          description: 'This output''s asset id — server-issued, and opaque. Pass it as `{"source": "asset", "asset_id": ...}` in a later submit''s media inputs to reuse this output as a reference. Null once the output has expired, since its bytes are no longer retrievable.'
        voice_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Voice Id
          description: The voice a voice-clone job created (`voice_<uuid>`). Send it back as `voice_id` on a text-to-speech submit to speak with this voice; it stays usable by the account that created it. Null for every other kind of output.
        url:
          anyOf:
          - type: string
          - type: 'null'
          format: uri
          title: Url
          description: Presigned download URL for the output bytes, or null once the output has expired. Each call to `GET /v3/jobs/{job_id}` returns a newly signed one.
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
          description: Download or reuse this output before this ISO-8601 instant. After it, `status` can change to `EXPIRED`, with `url`, `asset_id` and `expires_at` null; `DELETE /v3/jobs/{job_id}` makes that change at once. Null for an output that does not expire, such as a cloned voice.
        content_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Content Type
          description: MIME type of the output bytes.
        width:
          anyOf:
          - type: integer
          - type: 'null'
          title: Width
          description: Width in pixels; null for an output with no frame (audio).
        height:
          anyOf:
          - type: integer
          - type: 'null'
          title: Height
          description: Height in pixels; null for an output with no frame (audio).
        duration_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration Ms
          description: Duration in milliseconds; null for a still image.
        fps:
          anyOf:
          - type: integer
          - type: 'null'
          title: Fps
          description: The video's measured frame rate; null for a non-video output and for a video that has not been probed yet.
        error:
          anyOf:
          - $ref: '#/components/schemas/ErrorEnvelope'
          - type: 'null'
          description: Why this item failed — present on a failed item within an otherwise-completed batch.
      type: object
      title: OutputItem
      description: 'One item of a job''s `outputs[]` (`GET /v3/jobs/{job_id}`). `outputs` is

        always an array, even for a single output.


        Every key is always present. The ones a modality carries no value for

        serialize as null — an image output reports `duration_ms: null` and

        `fps: null`, an audio output `width: null` — so the shape is one object

        rather than one per modality. `url` and `asset_id` go null on an expired

        output, which has metadata but no retrievable bytes.


        A voice-clone job''s output is a voice rather than a file: it reports

        `voice_id` and leaves `url`, `content_type`, and `asset_id` null, since

        there are no bytes to fetch and nothing to pass back as a media input.'
    ErrorCode:
      type: string
      enum:
      - UNKNOWN
      - INVALID_ARGUMENT
      - NOT_FOUND
      - GONE
      - ALREADY_EXISTS
      - ALREADY_IN_PROGRESS
      - UNAUTHORIZED
      - PERMISSION_DENIED
      - INSUFFICIENT_BALANCE
      - MODERATION_FAILED
      - FAILED_PRECONDITION
      - CANCELLED
      - DEADLINE_EXCEEDED
      - RESOURCE_EXHAUSTED
      - UNAVAILABLE
      - INTERNAL
      title: ErrorCode
      description: "Universal error code space. Modeled after gRPC status codes.\n\nEvery exception in the system carries an ErrorCode. SDK clients map\n3rd-party errors to these codes at the lowest level. Retry logic,\nHTTP status mapping, and OTEL metrics all key off this enum.\n\nNOTE: The semantic meaning of these error codes is roughly mapped from the\n    semantic of the gRPC status codes: see\n    https://grpc.io/docs/guides/status-codes/ for details."
    JobLogSource:
      type: string
      enum:
      - api
      - worker
      - provider
      - cron
      title: JobLogSource
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorEnvelope'
        trace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Trace Id
          description: Debug id to quote to support (32-char hex trace id), also emitted as the `X-Trace-Id` response header.
      type: object
      required:
      - error
      title: ErrorResponse
      description: 'Top-level error body: ``{"error": {...}}`` plus a debug id.'
    BillingError:
      properties:
        balance:
          type: number
          title: Balance
          description: Spendable balance on the account this request bills, at the moment it was refused. The same value `GET /balance` returns.
        required:
          anyOf:
          - type: number
          - type: 'null'
          title: Required
          description: What this request needed. Null when the refusal is a funding precondition rather than a priced one — an upload is not priced, and some models cannot be quoted until their inputs are measured (`POST /models/{model}/estimate` says so explicitly).
        currency:
          type: string
          title: Currency
          description: ISO-4217 code the amounts above are denominated in.
          default: USD
        funding_url:
          type: string
          title: Funding Url
          description: Where a human can add funds to the account this request bills. The API itself cannot add them.
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: 'Why the automatic top-up did not fund the balance, when known. `card_declined`: the card that pays for automatic top-ups was declined, and the payment method must be updated on the billing page before a top-up can succeed. Clients MUST tolerate unrecognized values: new reasons may be added at any time.'
        affordable_output_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Affordable Output Tokens
          description: On a chat request's refusal, the largest output bound in tokens, `max_tokens` or `max_output_tokens` on `POST /responses`, whose hold the balance covers for this request's prompt. A chat request (`POST /chat/completions`, `POST /responses`, `POST /anthropic/v1/messages`) holds its worst-case price, `required`, until it completes. The balance covers the hold of the same request with this bound until the balance changes. 0 when the balance does not cover the prompt with the model's smallest output bound. Null on every other refusal.
      type: object
      required:
      - balance
      - funding_url
      title: BillingError
      description: 'Why a request was refused for funds, and what would clear it.


        The envelope''s structured detail for `INSUFFICIENT_BALANCE`, the way

        `details` is its structured detail for a validation failure. Every amount is

        in `currency`, and `balance` is the same number `GET /balance` returns — so

        a client can decide whether to top up, wait, or fail over without a second

        round trip to work out which balance was short.'
    StatusResponse:
      properties:
        job_id:
          type: string
          title: Job Id
          description: The job this status describes.
        status:
          $ref: '#/components/schemas/JobStatus'
        progress:
          anyOf:
          - type: number
          - type: 'null'
          maximum: 1.0
          minimum: 0.0
          title: Progress
          description: Estimated fraction of the job completed, from 0 to 1 (not a percentage). While `estimated_completion_at` is non-null, this value is computed from the time since submission and that estimate, so it is only as accurate as the estimate, and it stays below 1. While an `IN_QUEUE` or `IN_PROGRESS` job's `estimated_completion_at` is null, `GET /v3/jobs/{job_id}/status` reports 0. A `COMPLETED` job reports 1. A `FAILED` job's value can be anything from 0 to 1 and does not show how far the job got.
        estimated_completion_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Estimated Completion At
          description: ISO-8601 instant this job is estimated to finish. A job can finish well before or after it. The estimate can change while the job runs, so read it from each poll. Null once the job is `COMPLETED` or `FAILED`, and while no estimate is available. The submit response also includes it; `GET /v3/jobs/{job_id}` and `GET /v3/jobs` do not.
        logs:
          anyOf:
          - items:
              $ref: '#/components/schemas/JobLogItem'
            type: array
          - type: 'null'
          title: Logs
          description: Lifecycle events newer than the `logs_after` cursor, oldest first. Present only when `logs_after` is supplied; absent from the stream's `status` frames.
        logs_next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Logs Next Cursor
          description: Cursor to send as `logs_after` on the next poll. Absent when this poll delivered no new events — keep using the cursor you sent.
      type: object
      required:
      - job_id
      - status
      title: StatusResponse
      description: 'A job''s status, progress, and estimated completion time.


        Returned by `GET /v3/jobs/{job_id}/status`, and sent as each `status` frame

        of `GET /v3/jobs/{job_id}/stream`.'
    JobSummary:
      properties:
        job_id:
          type: string
          title: Job Id
          description: The job's id — server-issued, and opaque.
        model:
          type: string
          title: Model
          description: The resolved model id this job ran on.
        quality:
          anyOf:
          - type: string
          - type: 'null'
          title: Quality
          description: The quality level this job ran at; present only for models that offer quality levels.
        status:
          $ref: '#/components/schemas/JobStatus'
        created_at:
          type: string
          format: date-time
          title: Created At
          description: ISO-8601 instant the job was submitted.
      type: object
      required:
      - job_id
      - model
      - status
      - created_at
      title: JobSummary
    ErrorType:
      type: string
      enum:
      - invalid_request_error
      - authentication_error
      - permission_error
      - rate_limit_error
      - server_error
      title: ErrorType
      description: 'The OpenAI error type for an error''s HTTP status, published so an

        OpenAI SDK''s `APIStatusError.type` carries a value.'
    FieldError:
      properties:
        field:
          type: string
          title: Field
          description: Dotted path to the offending input (e.g. `input.resolution`).
        message:
          type: string
          title: Message
          description: What is wrong with this field's value.
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Machine-readable hint for which constraint failed ("required", "enum", "type", …).
        allowed:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Allowed
          description: Accepted values for an enum, or accepted field names on the first unknown-field violation. Omitted on subsequent unknown fields.
      type: object
      required:
      - field
      - message
      title: FieldError
      description: 'One field-level validation problem in a request body.


        `field` is the dotted path to the offending input (e.g. `input.resolution`);

        `allowed` lists the accepted values when the field is an enum, so a caller

        can fix it without re-fetching the model schema.'
    JobLogLevel:
      type: string
      enum:
      - info
      - warning
      - error
      title: JobLogLevel
    Metrics:
      properties:
        processing_time_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Processing Time Ms
          description: Wall-clock milliseconds between this job's `started` and `completed` lifecycle events. It brackets provider queueing, generation, output download, and any failed attempts with their retry backoff, so it measures the whole job rather than the model's own inference time, and it is not a provider-reported figure. Polled results and webhook deliveries report the same value. Null when the job did not record both events, after `DELETE /v3/jobs/{job_id}`, and possibly once the job's output is `EXPIRED`. For a chat completion, the milliseconds from dispatching the request to the provider until its last byte.
        time_to_first_token_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Time To First Token Ms
          description: For a chat completion, the milliseconds from dispatching the request to the provider until its first chunk. Absent for other jobs.
      type: object
      title: Metrics
      description: Timing measured for a completed job.
    JobLogItem:
      properties:
        id:
          type: integer
          title: Id
          description: Monotonically increasing id of this event within the job's log. Cursors are separate opaque values (`next_cursor` / `logs_next_cursor`); do not send this id as one.
        timestamp:
          type: string
          format: date-time
          title: Timestamp
          description: ISO-8601 instant the event was recorded.
        level:
          $ref: '#/components/schemas/JobLogLevel'
        event:
          $ref: '#/components/schemas/JobLogEvent'
        message:
          type: string
          title: Message
          description: Human-readable summary of the event.
        source:
          $ref: '#/components/schemas/JobLogSource'
        data:
          additionalProperties: true
          type: object
          title: Data
          description: Structured detail specific to this event type; empty when the event carries none.
      type: object
      required:
      - id
      - timestamp
      - level
      - event
      - message
      - source
      title: JobLogItem
      description: One customer-visible lifecycle event for a v3 job.
    JobLogEvent:
      type: string
      enum:
      - queued
      - started
      - moderation.passed
      - provider.submitted
      - provider.error
      - retry.scheduled
      - progress
      - finalizing
      - download.ready
      - completed
      - failed
      - recovered
      title: JobLogEvent
    JobStatus:
      type: string
      enum:
      - IN_QUEUE
      - IN_PROGRESS
      - COMPLETED
      - FAILED
      title: JobStatus
      description: The four states a job can be in.
  securitySchemes:
    KeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Primary scheme: `Authorization: Key <key_id>:<secret>`.'
    BearerToken:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer <credential>` — accepts an API key (`<key_id>:<secret>`) or an ephemeral browser token minted via `POST /tokens` (inherits the minting key''s scopes and workspace).'
