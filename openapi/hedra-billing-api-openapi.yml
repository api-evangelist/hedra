components:
  schemas:
    BillingError:
      properties:
        balance:
          type: number
          title: Balance
          description: Spendable balance on the account this request bills, at the moment it was refused. The same value `GET /balance` returns.
        required:
          anyOf:
          - type: number
          - type: 'null'
          title: Required
          description: What this request needed. Null when the refusal is a funding precondition rather than a priced one — an upload is not priced, and some models cannot be quoted until their inputs are measured (`POST /models/{model}/estimate` says so explicitly).
        currency:
          type: string
          title: Currency
          description: ISO-4217 code the amounts above are denominated in.
          default: USD
        funding_url:
          type: string
          title: Funding Url
          description: Where a human can add funds to the account this request bills. The API itself cannot add them.
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: 'Why the automatic top-up did not fund the balance, when known. `card_declined`: the card that pays for automatic top-ups was declined, and the payment method must be updated on the billing page before a top-up can succeed. Clients MUST tolerate unrecognized values: new reasons may be added at any time.'
        affordable_output_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Affordable Output Tokens
          description: On a chat request's refusal, the largest output bound in tokens, `max_tokens` or `max_output_tokens` on `POST /responses`, whose hold the balance covers for this request's prompt. A chat request (`POST /chat/completions`, `POST /responses`, `POST /anthropic/v1/messages`) holds its worst-case price, `required`, until it completes. The balance covers the hold of the same request with this bound until the balance changes. 0 when the balance does not cover the prompt with the model's smallest output bound. Null on every other refusal.
      type: object
      required:
      - balance
      - funding_url
      title: BillingError
      description: 'Why a request was refused for funds, and what would clear it.


        The envelope''s structured detail for `INSUFFICIENT_BALANCE`, the way

        `details` is its structured detail for a validation failure. Every amount is

        in `currency`, and `balance` is the same number `GET /balance` returns — so

        a client can decide whether to top up, wait, or fail over without a second

        round trip to work out which balance was short.'
    ErrorEnvelope:
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          title: Message
          description: Human-readable summary of the error. Fixed per condition — match on `code`, not on this text.
        retryable:
          type: boolean
          title: Retryable
          description: Whether retrying the same request can succeed. Describes the condition, not a promise — pair with `retry_after` when present.
          default: false
        retry_after:
          anyOf:
          - type: integer
          - type: 'null'
          title: Retry After
          description: Seconds to wait before retrying; set when the error is retryable. Mirrors the `Retry-After` response header.
        param:
          anyOf:
          - type: string
          - type: 'null'
          title: Param
          description: The primary offending input field, when the error is about one specific field.
        details:
          anyOf:
          - items:
              $ref: '#/components/schemas/FieldError'
            type: array
          - type: 'null'
          title: Details
          description: Every field-level problem, when the error is a validation failure — all of them at once, not just the first.
        replaced_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Replaced By
          description: The id of a successor model, set when the requested model has been retired (code `GONE`) and replaced; null otherwise. Lets a client programmatically migrate off a retired model.
        billing:
          anyOf:
          - $ref: '#/components/schemas/BillingError'
          - type: 'null'
          description: Balance, price, and where to add funds — set when the request was refused for funds (code `INSUFFICIENT_BALANCE`); null otherwise.
        type:
          $ref: '#/components/schemas/ErrorType'
          description: 'The OpenAI error type for this error''s HTTP status: `authentication_error` (401), `permission_error` (403), `rate_limit_error` (429), `server_error` (5xx), and `invalid_request_error` for every other status. Match on `code`, which is more specific.'
          readOnly: true
      type: object
      required:
      - code
      - message
      - type
      title: ErrorEnvelope
    BalanceResponse:
      properties:
        balance:
          type: number
          title: Balance
          description: Spendable balance.
        spent:
          anyOf:
          - type: number
          - type: 'null'
          title: Spent
          description: Amount consumed in the current billing period; null for the non-expiring API wallet (see GET /v3/usage).
        currency:
          type: string
          title: Currency
          description: ISO-4217 currency code for every amount in this response.
      type: object
      required:
      - balance
      - currency
      title: BalanceResponse
      description: 'Spendable balance on the account this key bills.


        Sourced from the workspace wallet for a workspace-bound key, else the

        caller''s personal balance. While the segregated API wallet is enabled, both

        key types instead read the API wallet that generation debits draw on (a

        personal key resolves its bound workspace).


        Every amount is in US dollars.'
    ErrorType:
      type: string
      enum:
      - invalid_request_error
      - authentication_error
      - permission_error
      - rate_limit_error
      - server_error
      title: ErrorType
      description: 'The OpenAI error type for an error''s HTTP status, published so an

        OpenAI SDK''s `APIStatusError.type` carries a value.'
    FieldError:
      properties:
        field:
          type: string
          title: Field
          description: Dotted path to the offending input (e.g. `input.resolution`).
        message:
          type: string
          title: Message
          description: What is wrong with this field's value.
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Machine-readable hint for which constraint failed ("required", "enum", "type", …).
        allowed:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Allowed
          description: Accepted values for an enum, or accepted field names on the first unknown-field violation. Omitted on subsequent unknown fields.
      type: object
      required:
      - field
      - message
      title: FieldError
      description: 'One field-level validation problem in a request body.


        `field` is the dotted path to the offending input (e.g. `input.resolution`);

        `allowed` lists the accepted values when the field is an enum, so a caller

        can fix it without re-fetching the model schema.'
    Discount:
      properties:
        model:
          type: string
          title: Model
          description: The model id the discount applies to.
        percent_off:
          type: number
          title: Percent Off
          description: Percentage off the model's list price, e.g. 20 or 12.5.
        starts_at:
          type: string
          format: date-time
          title: Starts At
          description: When the discount took effect.
        ends_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Ends At
          description: When the discount ends; null when open-ended.
      type: object
      required:
      - model
      - percent_off
      - starts_at
      title: Discount
      description: A negotiated discount the key's workspace is charged under now.
    TransactionListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/TransactionRecord'
          type: array
          title: Data
          description: This page of items.
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
          description: Opaque cursor for the next page, or null when this response completes the list. Always present. Endpoints that serve the whole collection at once always return null.
      type: object
      required:
      - data
      - next_cursor
      title: TransactionListResponse
    ErrorCode:
      type: string
      enum:
      - UNKNOWN
      - INVALID_ARGUMENT
      - NOT_FOUND
      - GONE
      - ALREADY_EXISTS
      - ALREADY_IN_PROGRESS
      - UNAUTHORIZED
      - PERMISSION_DENIED
      - INSUFFICIENT_BALANCE
      - MODERATION_FAILED
      - FAILED_PRECONDITION
      - CANCELLED
      - DEADLINE_EXCEEDED
      - RESOURCE_EXHAUSTED
      - UNAVAILABLE
      - INTERNAL
      title: ErrorCode
      description: "Universal error code space. Modeled after gRPC status codes.\n\nEvery exception in the system carries an ErrorCode. SDK clients map\n3rd-party errors to these codes at the lowest level. Retry logic,\nHTTP status mapping, and OTEL metrics all key off this enum.\n\nNOTE: The semantic meaning of these error codes is roughly mapped from the\n    semantic of the gRPC status codes: see\n    https://grpc.io/docs/guides/status-codes/ for details."
    DiscountListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Discount'
          type: array
          title: Data
          description: This page of items.
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
          description: Opaque cursor for the next page, or null when this response completes the list. Always present. Endpoints that serve the whole collection at once always return null.
      type: object
      required:
      - data
      - next_cursor
      title: DiscountListResponse
      description: 'The negotiated discounts the key''s workspace is charged under now.


        Every estimate and charge for these models already reflects them.'
    UsageResponse:
      properties:
        start:
          type: string
          format: date-time
          title: Start
          description: Window start (inclusive).
        end:
          type: string
          format: date-time
          title: End
          description: Window end (exclusive).
        group_by:
          $ref: '#/components/schemas/UsageGroupBy'
        total_jobs:
          type: integer
          title: Total Jobs
          description: Jobs submitted across the whole window, chat completions included.
        total_spent:
          type: number
          title: Total Spent
          description: Net amount spent across the whole window.
        currency:
          type: string
          title: Currency
          description: ISO-4217 currency code for every amount in this response.
        data:
          items:
            $ref: '#/components/schemas/UsageBucket'
          type: array
          title: Data
          description: One bucket per `group_by` group.
      type: object
      required:
      - start
      - end
      - group_by
      - total_jobs
      - total_spent
      - currency
      title: UsageResponse
    UsageBucket:
      properties:
        key:
          type: string
          title: Key
          description: 'What this bucket rolls up: `"total"`, an ISO date (`YYYY-MM-DD`, UTC), or a public model id — per `group_by`.'
        jobs:
          type: integer
          title: Jobs
          description: Jobs submitted in this bucket, chat completions included.
        spent:
          type: number
          title: Spent
          description: Net amount spent in this bucket.
      type: object
      required:
      - key
      - jobs
      - spent
      title: UsageBucket
      description: 'One usage rollup row. `key` is ``"total"`` for the summary, an ISO date

        (``YYYY-MM-DD``, UTC) for ``group_by=day``, or a public model id for

        ``group_by=model``.'
    TransactionRecord:
      properties:
        id:
          type: string
          title: Id
          description: The transaction's id. Stable, and the same id the V2 billing history reports for this transaction. An `llm_usage` transaction's id starts with `llm_usage:` and names its daily sum; a `sandbox_usage` transaction's id starts with `sandbox_usage:`.
        kind:
          type: string
          title: Kind
          description: 'What moved the balance: `purchase` when funds were bought, `grant` when they were granted by a plan entitlement, `usage` when a job was charged, `llm_usage` for a day''s chat requests to one model, summed into one row, `sandbox_usage` for what one GPU sandbox was charged, summed into one row, `refund` when a charge was returned, `adjustment` when Hedra corrected the balance, and `other` for a movement this API version does not yet name. The list is open and may gain values, so switch on it with a default branch; `amount` is authoritative for a kind you do not recognize.'
        amount:
          anyOf:
          - type: number
          - type: 'null'
          title: Amount
          description: 'The change to the balance, signed: negative for a charge, positive for funds arriving. Null for a transaction from before the wallet recorded amounts, whose movement is unknown rather than zero. For `llm_usage`, the sum of the day''s charges so far; for `sandbox_usage`, the net of the sandbox''s charges and refunds so far.'
        currency:
          anyOf:
          - type: string
          - type: 'null'
          title: Currency
          description: ISO-4217 currency code for `amount`; null exactly when `amount` is.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: ISO-8601 instant the balance moved. For `llm_usage`, the start of the day it covers; for `sandbox_usage`, when the sandbox was created.
        llm_usage:
          anyOf:
          - $ref: '#/components/schemas/TransactionLlmUsage'
          - type: 'null'
          description: Set exactly when `kind` is `llm_usage`; null on every other row.
        sandbox_usage:
          anyOf:
          - $ref: '#/components/schemas/TransactionSandboxUsage'
          - type: 'null'
          description: Set exactly when `kind` is `sandbox_usage`; null on every other row.
        list_amount:
          anyOf:
          - type: number
          - type: 'null'
          title: List Amount
          description: What `amount` would have been at the model's list price, before the discount negotiated for the workspace, in `currency`; negative, like the debit it describes, even when a 100% discount made `amount` 0. Set only on a `usage` or `sandbox_usage` row a discount applied to; null on every other row.
        discount_percent:
          anyOf:
          - type: number
          - type: 'null'
          title: Discount Percent
          description: The negotiated percentage off the model's list price that `amount` reflects, e.g. 20 or 12.5. Set exactly when `list_amount` is; null otherwise.
      type: object
      required:
      - id
      - kind
      - amount
      - currency
      - created_at
      title: TransactionRecord
      description: One movement of the API wallet's balance.
    UsageGroupBy:
      type: string
      enum:
      - total
      - day
      - model
      title: UsageGroupBy
    TransactionSandboxUsage:
      properties:
        accelerator:
          type: string
          title: Accelerator
          description: The GPU model and GPU count per instance, such as `h100:1`.
        replicas:
          type: integer
          title: Replicas
          description: How many instances the sandbox ran.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: When the sandbox was created. The transaction's `created_at` is this instant.
        ended_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Ended At
          description: When the sandbox's last instance stopped, or null while it runs.
      type: object
      required:
      - accelerator
      - replicas
      - created_at
      - ended_at
      title: TransactionSandboxUsage
      description: The GPU sandbox a `sandbox_usage` transaction sums.
    TransactionLlmUsage:
      properties:
        model:
          type: string
          title: Model
          description: The model the requests used.
        request_count:
          type: integer
          title: Request Count
          description: How many requests the row sums.
        period_start:
          type: string
          format: date-time
          title: Period Start
          description: Start of the UTC day the row covers. A request counts toward the day it was created, even when it was charged after midnight. `GET /v3/models/{model}/jobs` lists the requests as jobs.
        period_end:
          type: string
          format: date-time
          title: Period End
          description: 'End of the UTC day the row covers, exclusive: one day after `period_start`.'
      type: object
      required:
      - model
      - request_count
      - period_start
      - period_end
      title: TransactionLlmUsage
      description: The chat requests an `llm_usage` transaction sums.
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorEnvelope'
        trace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Trace Id
          description: Debug id to quote to support (32-char hex trace id), also emitted as the `X-Trace-Id` response header.
      type: object
      required:
      - error
      title: ErrorResponse
      description: 'Top-level error body: ``{"error": {...}}`` plus a debug id.'
  securitySchemes:
    KeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Primary scheme: `Authorization: Key <key_id>:<secret>`.'
    BearerToken:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer <credential>` — accepts an API key (`<key_id>:<secret>`) or an ephemeral browser token minted via `POST /tokens` (inherits the minting key''s scopes and workspace).'
