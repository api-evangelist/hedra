  /transactions:
    get:
      tags:
      - Billing
      summary: List Transactions
      description: 'Every movement of the API wallet''s balance, newest first: funds added,

        jobs charged, charges refunded, and corrections. Chat requests are summed

        into one `llm_usage` row per model per UTC day. Scoped to the workspace the

        credential bills, the same one `GET /v3/balance` reports, so an

        `llm_usage` row sums every member''s requests.'
      operationId: billing_list_transactions
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum items per page.
          default: 20
          title: Limit
        description: Maximum items per page.
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Opaque cursor from the previous page's `next_cursor`; omit for the first page.
          title: Cursor
        description: Opaque cursor from the previous page's `next_cursor`; omit for the first page.
