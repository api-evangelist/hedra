- aid: hedra:hedra-run-a-model-api
  name: Hedra Run a model API
  description: >-
    One typed submit endpoint per image, video and audio model — titled `Run <name> (<id>)`, so the model
    you know by name is the operation you call. Every one returns the same `202` job envelope; track it
    under Jobs.


    `POST /models/{model}` is the same call with the id supplied at runtime and `input` untyped — use
    it for a model your client was generated before, or one you looked up in `GET /models`.


    A chat model (`modality: text` in `GET /models`) runs on `POST /chat/completions` instead, which answers
    with the completion itself in the OpenAI chat-completions format, not a job.
