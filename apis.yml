aid: hedra
name: Hedra
description: >-
  Hedra is a generative-media AI lab and creative platform that lets you produce image, video,
  and audio content through a web studio and a developer API. Its proprietary Character-3 model
  powers expressive talking-head and character video, and the platform brokers access to leading
  partner models (Veo, Kling, Grok, Nano Banana Pro, Flux, Sana) behind one credit-based account.
  The Hedra Web API exposes a small, uniform surface — list models and voices, upload assets,
  submit generations (image, video, avatar, text-to-speech, voice clone, upscale, video-to-video),
  poll generation status, and check billing credits — authenticated with an X-API-Key header.
  Hedra ships first-party Python, Node/TypeScript, and Rust CLI clients. Backed by a16z.
